---
# portainer and traefik deployment
x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

x-common-labels: &default-labels
  logging: "promtail"
  logging_jobname: "containerlogs"
  stackname: "${MONITORING_STACK}"

services:
  traefik:
    image: traefik:${TRAEFIK_VER:-latest}
    container_name: traefik
    restart: unless-stopped
    command:
      # Enable debug logging
      #- --log.level=DEBUG

      # Enable Docker provider
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

      # Configure entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      # Enable Let's Encrypt with DNS challenge
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=route53
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=${DNS_RESOLVER:-9.9.9.9}
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.delayBeforeCheck=30
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      #- --certificatesresolvers.letsencrypt.acme.caServer=https://acme-staging-v02.api.letsencrypt.org/directory

      # Enable dashboard (optional)
      - --api.dashboard=true
      - --api.insecure=false

      # Redirect HTTP to HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    environment:
      # Host/Port details for Traefik & Portainer
      - TRAEFIK_HOST=${TRAEFIK_HOST}
      # AWS credentials for Route53 DNS challenge
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # Optional: Specify hosted zone ID for better performance
      - AWS_HOSTED_ZONE_ID=${AWS_HOSTED_ZONE_ID}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - traefik
    labels:
      <<: *default-labels
      traefik.enable: true
      traefik.http.routers.traefik.rule: Host(`${TRAEFIK_HOST}`)
      traefik.http.routers.traefik.tls: true
      traefik.http.routers.traefik.tls.certresolver: letsencrypt
      traefik.http.routers.traefik.service: api@internal
    logging: *default-logging

  portainer:
    image: portainer/portainer-${PORTAINER_EDITION:-ce}:${PORTAINER_VER:-latest}
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - traefik
    labels:
      <<: *default-labels
      traefik.enable: true
      traefik.http.routers.portainer.rule: Host(`${PORTAINER_HOST}`)
      traefik.http.routers.portainer.tls: true
      traefik.http.routers.portainer.tls.certresolver: letsencrypt
      traefik.http.services.portainer.loadbalancer.server.port: ${PORTAINER_PORT}
    logging: *default-logging

volumes:
  portainer_data:
  traefik_letsencrypt:

networks:
  traefik:
    name: ${NETWORK}
    external: false