---
# portainer, traefik, and dnsweaver deployment - standalone (docker compose
# up -d), single host only. AWS and Technitium credentials are delivered via
# mounted secrets files (secrets/aws_credentials, secrets/technitium_token -
# both gitignored), not plain environment variables - plain env vars are
# visible via `docker inspect`, this isn't.
x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

x-common-labels: &default-labels
  logging: "promtail"
  logging_jobname: "containerlogs"
  stackname: "${MONITORING_STACK}"

services:
  traefik:
    image: traefik:${TRAEFIK_VER:-latest}
    container_name: traefik
    restart: unless-stopped
    command:
      # Enable debug logging
      #- --log.level=DEBUG

      # Enable Docker provider
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

      # Configure entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      # Enable Let's Encrypt with DNS challenge
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=route53
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=${DNS_RESOLVER:-9.9.9.9}
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.delayBeforeCheck=30
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      #- --certificatesresolvers.letsencrypt.acme.caServer=https://acme-staging-v02.api.letsencrypt.org/directory

      # Enable dashboard (optional)
      - --api.dashboard=true
      - --api.insecure=false

      # Redirect HTTP to HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    environment:
      - TRAEFIK_HOST=${TRAEFIK_HOST}
      - AWS_SHARED_CREDENTIALS_FILE=/run/secrets/aws_credentials
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # Optional: Specify hosted zone ID for better performance
      - AWS_HOSTED_ZONE_ID=${AWS_HOSTED_ZONE_ID}
    secrets:
      - aws_credentials
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_DIR:-./data}/letsencrypt:/letsencrypt
    networks:
      - traefik
    labels:
      <<: *default-labels
      traefik.enable: "true"
      traefik.http.routers.traefik.rule: Host(`${TRAEFIK_HOST}`)
      traefik.http.routers.traefik.tls: "true"
      traefik.http.routers.traefik.tls.certresolver: letsencrypt
      traefik.http.routers.traefik.service: api@internal
      # The router above points at the special api@internal service, so this
      # port is never actually used for routing - but Traefik still tries to
      # build a default load-balancer service for any traefik.enable=true
      # container and errors ("port is missing") without one. 8080 is
      # Traefik's own internal API/dashboard port.
      traefik.http.services.traefik.loadbalancer.server.port: "8080"
    logging: *default-logging

  portainer:
    image: portainer/portainer-${PORTAINER_EDITION:-ce}:${PORTAINER_VER:-latest}
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR:-./data}/portainer-data:/data
    networks:
      - traefik
    labels:
      <<: *default-labels
      traefik.enable: "true"
      traefik.http.routers.portainer.rule: Host(`${PORTAINER_HOST}`)
      traefik.http.routers.portainer.tls: "true"
      traefik.http.routers.portainer.tls.certresolver: letsencrypt
      traefik.http.services.portainer.loadbalancer.server.port: "${PORTAINER_PORT:-9000}"
    logging: *default-logging

  # Watches Traefik's labels and auto-creates/removes a DNS record for any
  # Host() rule matching DNSWEAVER_INTERNAL_DOMAINS - so an app deployed via
  # Portainer's GitOps feature gets working DNS without a manual step.
  # Tracks ownership of the records it creates via a TXT marker, so it won't
  # touch a record it didn't create itself (e.g. this stack's own Terraform-
  # managed DNS) even if the label also matches the domain glob - verified
  # live: it correctly skips both Portainer's own record and a
  # self-referential CNAME onto DNSWEAVER_INTERNAL_TARGET.
  #
  # On by default via COMPOSE_PROFILES=dnsweaver in .env.example - profile-
  # gated rather than unconditional so a fresh bootstrap without
  # secrets/technitium_token provisioned yet doesn't fail to start, but on
  # by default so a rebuild doesn't silently lose DNS automation with no
  # obvious signal anything's missing.
  dnsweaver:
    image: maxamill/dnsweaver:${DNSWEAVER_VER:-latest}
    restart: unless-stopped
    profiles: ["dnsweaver"]
    environment:
      - DNSWEAVER_DOCKER_MODE=standalone
      - DNSWEAVER_INSTANCES=internal
      - DNSWEAVER_INTERNAL_TYPE=technitium
      - DNSWEAVER_INTERNAL_URL=${TECHNITIUM_URL}
      - DNSWEAVER_INTERNAL_TOKEN_FILE=/run/secrets/technitium_token
      - DNSWEAVER_INTERNAL_ZONE=${DNSWEAVER_ZONE}
      - DNSWEAVER_INTERNAL_RECORD_TYPE=CNAME
      - DNSWEAVER_INTERNAL_TARGET=${TRAEFIK_HOST}
      - DNSWEAVER_INTERNAL_DOMAINS=${DNSWEAVER_DOMAINS}
      - DNSWEAVER_SOURCES=traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    secrets:
      - technitium_token

secrets:
  aws_credentials:
    file: ./secrets/aws_credentials
  technitium_token:
    file: ./secrets/technitium_token

networks:
  traefik:
    name: ${NETWORK}
    external: false
