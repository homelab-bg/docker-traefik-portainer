---
# Swarm-mode overlay - layer on top of docker-compose.yml when deploying to a
# Docker Swarm cluster instead of a single host:
#
#   docker stack deploy -c docker-compose.yml -c docker-compose.swarm.yml <stack>
#
# No placement constraints needed: traefik_letsencrypt/portainer_data bind to a
# CephFS mount shared identically across every node in the cluster, instead of
# Docker's node-local `local` volume driver, so either service can run on (or
# be rescheduled to) any node without losing certs/data.
services:
  traefik:
    # Full restatement, not an env var tweak - `command:` is replaced wholesale
    # by Compose when set in an overlay, and Traefik v3 removed the v2-era
    # `providers.docker.swarmMode` flag entirely in favour of a separate Swarm
    # Provider (--providers.swarm), so this also has to drop --providers.docker
    # rather than just adding a flag to it (a v2 assumption that doesn't apply
    # here - see https://doc.traefik.io/traefik/v3.5/providers/swarm/).
    command:
      - --log.level=INFO
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=route53
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=${DNS_RESOLVER:-9.9.9.9}
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.delayBeforeCheck=30
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --api.dashboard=true
      - --api.insecure=false
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    volumes:
      - /mnt/cephfs/traefik-portainer/letsencrypt:/letsencrypt
    # The Swarm Provider reads labels from the SERVICE spec (deploy.labels),
    # not container labels (docker-compose.yml's plain `labels:`, which is what
    # the Docker provider used by `docker compose up` reads instead) - confirmed
    # against the official docs: "Attach labels to a single service (not
    # containers) while in Swarm mode." Without this, exposedbydefault=false
    # means the Swarm provider sees no traefik.enable anywhere and silently
    # filters every service out ("Filtering disabled container" in the logs) -
    # no router ever gets registered, so no cert ever gets requested either.
    # Duplicates docker-compose.yml's labels rather than replacing them, since
    # the base file still needs its own copy for docker compose up to work.
    deploy:
      labels:
        traefik.enable: "true"
        traefik.http.routers.traefik.rule: Host(`${TRAEFIK_HOST}`)
        traefik.http.routers.traefik.tls: "true"
        traefik.http.routers.traefik.tls.certresolver: letsencrypt
        traefik.http.routers.traefik.service: api@internal

  portainer:
    volumes:
      - /mnt/cephfs/traefik-portainer/portainer-data:/data
    deploy:
      labels:
        traefik.enable: "true"
        traefik.http.routers.portainer.rule: Host(`${PORTAINER_HOST}`)
        traefik.http.routers.portainer.tls: "true"
        traefik.http.routers.portainer.tls.certresolver: letsencrypt
        traefik.http.services.portainer.loadbalancer.server.port: ${PORTAINER_PORT}
